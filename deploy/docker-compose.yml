services:
  personal-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PA_DATA_DIR: /data
      PA_ADDR: :8080
      PA_SECURE_COOKIES: ${PA_SECURE_COOKIES:-false}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:?set BOOTSTRAP_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      PA_MODELS: ${PA_MODELS:-}
    volumes:
      - pa-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: [domain]
    environment:
      PA_DOMAIN: ${PA_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - personal-agent
    restart: unless-stopped

volumes:
  pa-data:
  caddy-data:
  caddy-config:
