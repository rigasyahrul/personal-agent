# Live-reload override for local development (API + web as one service).
# Usage:
#   make docker-dev              # up (no rebuild)
#   make docker-dev-build        # up --build
#   docker compose --env-file deploy/.env \
#     -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up
#
# Do not combine with a plain production up on the same :8080 port.
services:
  personal-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    working_dir: /src
    command: ["dev-entrypoint"]
    volumes:
      - pa-data:/data
      # Full repo: Air reloads Go; Vite reads web/src directly for HMR.
      - ..:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      PA_DATA_DIR: /data
      PA_ADDR: :8080
      PA_UI_DEV_PROXY: http://127.0.0.1:5173
    restart: 'no'

volumes:
  go-mod-cache:
  go-build-cache:
